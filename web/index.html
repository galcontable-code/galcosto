<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Galcosto — facturación electrónica ARCA en tiempo real para estudios contables."
    />
    <title>Galcosto — Facturación electrónica ARCA</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e3a8a'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='17' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Se aplica el tema antes del primer pintado para evitar el parpadeo.
      (function () {
        try {
          var guardado = localStorage.getItem('galcosto.theme');
          var oscuro =
            guardado === 'dark' ||
            (guardado !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage bloqueado: seguimos en claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
